name: Build and Release

on:
  release:
    types: [created]

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            output_name: maya-canteen-linux
            asset_name: maya-canteen-linux
          - os: windows-latest
            output_name: maya-canteen-windows.exe
            asset_name: maya-canteen-windows.exe
          - os: macos-latest
            output_name: maya-canteen-macos
            asset_name: maya-canteen-macos

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          check-latest: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "latest"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "latest"
          run_install: false

      - name: Get Frontend Dependencies
        run: |
          cd frontend
          pnpm install --frozen-lockfile

      - name: Build Frontend
        run: |
          cd frontend
          pnpm build

      - name: Set version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Building version: $VERSION"

      - name: Generate Windows resources
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          go install github.com/tc-hib/go-winres@latest
          choco install imagemagick -y
          magick frontend/public/mayabytes-favicon-270x270.png -resize 256x256 cmd/api/winres/icon.png
          cd cmd/api
          go-winres make --product-version "$env:VERSION.0" --file-version "$env:VERSION.0"

      - name: Build Backend for Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $env:CGO_ENABLED = "1"
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          $buildTime = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          go build -ldflags "-X maya-canteen/internal/version.Version=$env:VERSION -X maya-canteen/internal/version.GitCommit=${{ github.sha }} -X maya-canteen/internal/version.BuildTime=$buildTime" -o ${{ matrix.output_name }} cmd/api/main.go

      - name: Build Backend for Linux/macOS
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          if [ "${{ matrix.os }}" == "ubuntu-latest" ]; then
            export GOOS=linux
          else
            export GOOS=darwin
          fi
          CGO_ENABLED=1 GOARCH=amd64 go build -ldflags "-X maya-canteen/internal/version.Version=$VERSION -X maya-canteen/internal/version.GitCommit=${{ github.sha }} -X 'maya-canteen/internal/version.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)'" -o ${{ matrix.output_name }} cmd/api/main.go

      - name: Upload release asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./${{ matrix.output_name }}
          asset_name: ${{ matrix.asset_name }}
          asset_content_type: application/octet-stream